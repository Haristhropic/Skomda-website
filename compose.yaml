name: skomda-infra

x-security: &security
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: local
    options: {max-size: 10m, max-file: "3"}
  networks: [app]

services:
  edge:
    <<: *security
    image: nginx:1.28-alpine
    user: nginx
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/releases:/etc/nginx/releases:ro
    mem_limit: 96m
    cpus: 1.5
    ulimits:
      nofile: {soft: 8192, hard: 8192}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9090/status]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      app: {aliases: [frontend, backend]}
  redis:
    <<: *security
    image: redis:7.4-alpine
    user: redis
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    volumes:
      - ./secrets/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    mem_limit: 192m
    cpus: 0.75
    healthcheck:
      test: [CMD-SHELL, "redis-cli --raw ping 2>&1 | grep -q NOAUTH"]
      interval: 10s
      timeout: 3s
      retries: 3
  prometheus:
    <<: *security
    image: prom/prometheus:v3.7.3
    environment: {GOMAXPROCS: "2"}
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=512MB"]
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    mem_limit: 256m
    cpus: 0.5
  nginx-exporter:
    <<: *security
    image: nginx/nginx-prometheus-exporter:1.5.1
    environment: {GOMAXPROCS: "1"}
    command: ["--nginx.scrape-uri=http://edge:9090/status"]
    mem_limit: 48m
    cpus: 0.2
  loki:
    <<: *security
    image: grafana/loki:3.5.7
    environment: {GOMAXPROCS: "2"}
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deploy/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    mem_limit: 256m
    cpus: 0.5
  grafana:
    <<: *security
    image: grafana/grafana:12.2.1
    environment:
      GOMAXPROCS: "2"
      GF_SERVER_ROOT_URL: ${FRONTEND_ORIGIN:-https://linear.smktelkom-sidoarjo.my.id}/api/observability/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_LIVE_MAX_CONNECTIONS: "0"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_ADMIN_USER: local-recovery-admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_WHITELIST: 172.29.0.0/24
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./secrets/grafana_password:/run/secrets/grafana_password:ro
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 256m
    cpus: 0.5

networks:
  app:
    external: true
    name: skomda-runtime

volumes:
  redis-data:
  prometheus-data:
  loki-data:
  grafana-data:
