name: CI and demo deployment

on:
  push:
    branches: [main, master, deploy]
  pull_request:
    branches: [main, master, deploy]

permissions:
  contents: read

concurrency:
  group: skomda-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./...

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api-linear.smktelkom-sidoarjo.my.id/api
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ""
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ""

  container-images:
    name: Build and publish demo images
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
      image-owner: ${{ steps.owner.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image owner
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set immutable image tag
        id: tag
        shell: bash
        run: echo "value=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/skomda-backend:${{ steps.tag.outputs.value }}
            ghcr.io/${{ steps.owner.outputs.value }}/skomda-backend:demo-latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/skomda-frontend:${{ steps.tag.outputs.value }}
            ghcr.io/${{ steps.owner.outputs.value }}/skomda-frontend:demo-latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-linear.smktelkom-sidoarjo.my.id/api
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_CLARITY_PROJECT_ID=${{ vars.NEXT_PUBLIC_CLARITY_PROJECT_ID }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # These scans run after publication to GHCR but before the dependent
      # deploy job, so an image with actionable High/Critical CVEs is not
      # rolled out to the demo VPS.
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.owner.outputs.value }}/skomda-backend:${{ steps.tag.outputs.value }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.owner.outputs.value }}/skomda-frontend:${{ steps.tag.outputs.value }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan backend image with Docker Scout
        if: vars.DOCKER_SCOUT_ENABLED == 'true'
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ghcr.io/${{ steps.owner.outputs.value }}/skomda-backend:${{ steps.tag.outputs.value }}
          only-severities: critical,high
          exit-code: true
          dockerhub-user: ${{ vars.DOCKER_SCOUT_HUB_USER }}
          dockerhub-password: ${{ secrets.DOCKER_SCOUT_HUB_PASSWORD }}
          registry-user: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan frontend image with Docker Scout
        if: vars.DOCKER_SCOUT_ENABLED == 'true'
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ghcr.io/${{ steps.owner.outputs.value }}/skomda-frontend:${{ steps.tag.outputs.value }}
          only-severities: critical,high
          exit-code: true
          dockerhub-user: ${{ vars.DOCKER_SCOUT_HUB_USER }}
          dockerhub-password: ${{ secrets.DOCKER_SCOUT_HUB_PASSWORD }}
          registry-user: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  deploy-demo:
    name: Deploy demo to VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy' && vars.DEMO_DEPLOY_ENABLED == 'true'
    needs: container-images
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Deploy immutable image tag over SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          IMAGE_TAG: ${{ needs.container-images.outputs.image-tag }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Set VPS_HOST in the demo environment secrets}"
          : "${VPS_USER:?Set VPS_USER in the demo environment secrets}"
          : "${VPS_SSH_PRIVATE_KEY:?Set VPS_SSH_PRIVATE_KEY in the demo environment secrets}"
          : "${VPS_KNOWN_HOSTS:?Set VPS_KNOWN_HOSTS in the demo environment secrets}"
          VPS_SSH_PORT="${VPS_SSH_PORT:-22}"
          [[ "$VPS_SSH_PORT" =~ ^[0-9]+$ ]] || { echo "VPS_SSH_PORT must be numeric" >&2; exit 1; }
          : "${VPS_DEPLOY_PATH:?Set VPS_DEPLOY_PATH in the demo environment variables}"

          install -d -m 700 "$HOME/.ssh"
          key_content="${VPS_SSH_PRIVATE_KEY//$'\r'/}"
          key_content="${key_content//\\n/$'\n'}"
          printf '%s\n' "$key_content" > "$HOME/.ssh/deploy_key"
          unset key_content
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          if ! ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null 2>&1; then
            echo "VPS_SSH_PRIVATE_KEY is not a parseable OpenSSH private key. Use the complete private key, not a .pub/authorized_keys file or PuTTY .ppk; keep the BEGIN/END lines." >&2
            exit 1
          fi
          deploy_path_b64="$(printf '%s' "$VPS_DEPLOY_PATH" | base64 -w 0)"

          # Install the read-only operations checker; it is not executed by CI.
          scp -i "$HOME/.ssh/deploy_key" \
            -P "$VPS_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            scripts/vps-status.py \
            "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/vps-status.py"

          ssh -i "$HOME/.ssh/deploy_key" \
            -p "$VPS_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_PATH_B64=$deploy_path_b64 IMAGE_TAG=$IMAGE_TAG bash -s" \
            < scripts/deploy-demo.sh
