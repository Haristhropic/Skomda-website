worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Log paths only: never credentials, cookies, query strings, request bodies, IPs.
  log_format safe escape=json '{"time":"$time_iso8601","method":"$request_method","status":$status,"duration":$request_time,"upstream":"$upstream_addr"}';
  access_log /dev/stdout safe;
  server_tokens off;
  resolver 127.0.0.11 ipv6=off valid=5s;
  resolver_timeout 2s;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  client_max_body_size 11m;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_body_timeout 15s;
  client_header_timeout 15s;
  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_connect_timeout 3s;
  proxy_read_timeout 35s;
  proxy_send_timeout 35s;
  proxy_next_upstream error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries 2;
  # Mutating requests are never replayed after a response/partial write.
  include /etc/nginx/releases/active.conf;
  server {
    listen 9090;
    location = /status { stub_status; access_log off; }
    location / { return 404; }
  }
}
