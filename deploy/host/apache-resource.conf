# Webuzo's legacy sites share a VPS with a provider PID ceiling of 500.
# Keep worker and HTTP/2 threads bounded; SKOMDA traffic goes through Docker/Nginx.
<IfModule mpm_worker_module>
  StartServers 1
  ThreadsPerChild 16
  MinSpareThreads 16
  MaxSpareThreads 32
  MaxRequestWorkers 32
</IfModule>
<IfModule http2_module>
  H2MinWorkers 1
  H2MaxWorkers 4
</IfModule>
