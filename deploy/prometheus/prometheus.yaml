global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: skomda-backend
    dns_sd_configs:
      - names: [blue-backend-a, blue-backend-b, green-backend-a, green-backend-b]
        type: A
        port: 9091
  - job_name: nginx
    static_configs:
      - targets: [nginx-exporter:9113]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
