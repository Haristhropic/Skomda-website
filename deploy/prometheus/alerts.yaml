groups:
  - name: skomda
    rules:
      - alert: EncryptedDatabaseBackupStale
        expr: skomda_host_backup_age_seconds > 90000
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Backup database terenkripsi terakhir lebih dari 25 jam"}
      - alert: VPSProcessesNearProviderLimit
        expr: skomda_host_pids_current / skomda_host_pids_max > 0.9
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Proses/thread VPS mendekati limit provider"}
      - alert: VPSDiskLow
        expr: skomda_host_disk_available_bytes / skomda_host_disk_total_bytes < 0.15
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Ruang disk VPS tersisa di bawah15persen"}
      - alert: APIAllReplicasUnavailable
        expr: sum(up{job="skomda-backend"}) == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Tidak ada replica API yang dapat dipantau"}
      - alert: APIErrorRate
        expr: sum(rate(skomda_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(skomda_http_requests_total[5m])), 0.01) > 0.01
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Error HTTP API di atas satu persen"}
